services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      DB_HOST: mysql
      DB_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    user: "1000:1000"
    healthcheck:
      test: [ "CMD","php-fpm","-t" ]
      interval: 5s
      retries: 5

  nginx:
    image: nginx:1.25
    ports:
      - "8080:80"
    restart: unless-stopped
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf


  mysql:
    image: mysql:8.4
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: wgn_spain
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot --silent" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  queue-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      DB_HOST: mysql
      DB_PASSWORD: root
    depends_on:
      - php
      - mysql
    restart: unless-stopped
    volumes:
      - .:/var/www/html

volumes:
  mysql_data:
